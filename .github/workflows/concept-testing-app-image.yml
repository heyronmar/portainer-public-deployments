# Builds the concept-testing-app image and publishes it to GHCR for the
# Kubernetes manifest at local/portainer-run-applications/concept-testing-app/src/k8s/.
name: concept-testing-app image

on:
  push:
    branches: [main]
    paths:
      - local/portainer-run-applications/concept-testing-app/src/**
      - .github/workflows/concept-testing-app-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/heyronmar/concept-testing-app
  CONTEXT: local/portainer-run-applications/concept-testing-app/src

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=concept-testing-app
            org.opencontainers.image.description=Portainer V3 concept test
      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
