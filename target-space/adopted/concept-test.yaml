# Portainer V3 concept test on Kubernetes.
#
# Before applying, create the admin credentials Secret (kept out of git):
#   kubectl -n namespaces create secret generic concept-test-admin \
#     --from-literal=username=admin --from-literal=password='<password>'
#
# Single replica only: responses live in one SQLite file on a ReadWriteOnce volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: concept-test-data
  namespace: namespaces
  labels:
    app: concept-test
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: concept-test
  namespace: namespaces
  labels:
    app: concept-test
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: concept-test
  template:
    metadata:
      labels:
        app: concept-test
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: concept-test
          # Pinned to a build so every update is a manifest change that rolls out a new pod.
          # Tags are sha-<commit in portainer-public-deployments>; see README "Updating".
          image: ghcr.io/heyronmar/concept-testing-app:sha-b6463ae0e10360b8aa7878fea0b2dc62bbdaf639
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            # Kubernetes sets HOSTNAME to the pod name; the Next.js server binds to it, so pin it.
            - name: HOSTNAME
              value: 0.0.0.0
            - name: PORT
              value: '3000'
            - name: DATABASE_PATH
              value: /data/concept-test.db
            - name: DEMO_URL
              value: https://portainer-laptop.heyronmar.com
            # Optional sign-in shown on the demo step. Kept in a Secret, never in git; the card is hidden until it exists.
            - name: DEMO_USER
              valueFrom:
                secretKeyRef:
                  name: concept-test-demo
                  key: username
                  optional: true
            - name: DEMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: concept-test-demo
                  key: password
                  optional: true
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: concept-test-admin
                  key: username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: concept-test-admin
                  key: password
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: concept-test-data
---
apiVersion: v1
kind: Service
metadata:
  name: concept-test
  namespace: namespaces
  labels:
    app: concept-test
spec:
  type: ClusterIP
  selector:
    app: concept-test
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: concept-test
  namespace: namespaces
  labels:
    app: concept-test
spec:
  rules:
    - host: concept-test.heyronmar.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: concept-test
                port:
                  name: http
