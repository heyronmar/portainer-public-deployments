apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portainer-manual-data
  namespace: portainer-run-applications
  labels:
    app: portainer-manual
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: d23790e8-fdc7-4cd0-9958-d0545086c15a
    portainer-run/git-branch: main
    portainer-run/git-path: local/portainer-run-applications/portainer-manual.yaml
    portainer-run/vibe-source-path: local/portainer-run-applications/portainer-manual/src
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portainer-manual
  namespace: portainer-run-applications
  labels:
    app: portainer-manual
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: d23790e8-fdc7-4cd0-9958-d0545086c15a
    portainer-run/git-branch: main
    portainer-run/git-path: local/portainer-run-applications/portainer-manual.yaml
    portainer-run/vibe-source-path: local/portainer-run-applications/portainer-manual/src
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portainer-manual
  template:
    metadata:
      labels:
        app: portainer-manual
        managed-by: portainer-run
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      initContainers:
        - name: vibe-sync
          image: alpine/git:latest
          command:
            - sh
            - '-c'
            - >-
              git config --global http.sslVerify false && git clone --depth 1 --branch main
              https://${GIT_USERNAME}:${GIT_TOKEN}@github.com/heyronmar/portainer-public-deployments /tmp/repo && mkdir
              -p /usr/share/nginx/html && cp -r /tmp/repo/local/portainer-run-applications/portainer-manual/src/.
              /usr/share/nginx/html/ && rm -rf /tmp/repo
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: app-data
              mountPath: /usr/share/nginx/html
          env:
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: portainer-manual-git-credentials
                  key: username
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: portainer-manual-git-credentials
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: portainer-manual
          image: nginxinc/nginx-unprivileged:alpine
          command:
            - sh
            - '-c'
            - nginx -g 'daemon off;'
          workingDir: /usr/share/nginx/html
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: app-data
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: '1'
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: portainer-manual-data
---
apiVersion: v1
kind: Service
metadata:
  name: portainer-manual
  namespace: portainer-run-applications
  labels:
    app: portainer-manual
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: d23790e8-fdc7-4cd0-9958-d0545086c15a
    portainer-run/git-branch: main
    portainer-run/git-path: local/portainer-run-applications/portainer-manual.yaml
    portainer-run/vibe-source-path: local/portainer-run-applications/portainer-manual/src
spec:
  type: ClusterIP
  selector:
    app: portainer-manual
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portainer-manual
  namespace: portainer-run-applications
  labels:
    app: portainer-manual
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: d23790e8-fdc7-4cd0-9958-d0545086c15a
    portainer-run/git-branch: main
    portainer-run/git-path: local/portainer-run-applications/portainer-manual.yaml
    portainer-run/vibe-source-path: local/portainer-run-applications/portainer-manual/src
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
    - host: portainer-manual.heyronmar.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portainer-manual
                port:
                  number: 8080
