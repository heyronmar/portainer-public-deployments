apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: concept-test-data
  namespace: portainer-run-applications
  labels:
    app: concept-test
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: 9f82e57a-d8d6-4cc0-a4f6-3fbcc84cca21
    portainer-run/git-branch: main
    portainer-run/git-path: local/portainer-run-applications/concept-test.yaml
    portainer-run/runtime: nginx
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: concept-test
  namespace: portainer-run-applications
  labels:
    app: concept-test
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: 9f82e57a-d8d6-4cc0-a4f6-3fbcc84cca21
    portainer-run/git-branch: main
    portainer-run/git-path: local/portainer-run-applications/concept-test.yaml
    portainer-run/runtime: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: concept-test
  template:
    metadata:
      labels:
        app: concept-test
        managed-by: portainer-run
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      initContainers:
        - name: vibe-web-guard
          image: nginxinc/nginx-unprivileged:alpine
          command:
            - sh
            - '-c'
            - >-
              cp -a /etc/nginx/conf.d/. /guard/ && printf '%s' 'location ~ /\.(?!well-known/) { deny all; }

              ' > /guard/run-deny-dotfiles.inc && sed -i '/^server {/a include /etc/nginx/conf.d/run-deny-dotfiles.inc;'
              /guard/default.conf && grep -q run-deny-dotfiles.inc /guard/default.conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: nginx-conf
              mountPath: /guard
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        - name: vibe-sync
          image: alpine/git:latest
          command:
            - sh
            - '-c'
            - >-
              git config --global http.sslVerify false && git clone --depth 1 --branch main
              https://${GIT_USERNAME}:${GIT_TOKEN}@github.com/heyronmar/portainer-public-deployments /tmp/repo && rm -rf
              /tmp/repo/.git && rm -rf /usr/share/nginx/html/.git /usr/share/nginx/html/.env && mkdir -p
              /usr/share/nginx/html && cp -r /tmp/repo/local/portainer-run-applications/concept-testing-app/.
              /usr/share/nginx/html/ && rm -rf /tmp/repo
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: app-data
              mountPath: /usr/share/nginx/html
          env:
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: concept-test-git-credentials
                  key: username
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: concept-test-git-credentials
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: concept-test
          image: nginxinc/nginx-unprivileged:alpine
          command:
            - sh
            - '-c'
            - nginx -g 'daemon off;'
          workingDir: /usr/share/nginx/html
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: app-data
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: '1'
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: concept-test-data
        - name: nginx-conf
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: concept-test
  namespace: portainer-run-applications
  labels:
    app: concept-test
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: 9f82e57a-d8d6-4cc0-a4f6-3fbcc84cca21
    portainer-run/git-branch: main
    portainer-run/git-path: local/portainer-run-applications/concept-test.yaml
    portainer-run/runtime: nginx
spec:
  type: ClusterIP
  selector:
    app: concept-test
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: concept-test
  namespace: portainer-run-applications
  labels:
    app: concept-test
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: 9f82e57a-d8d6-4cc0-a4f6-3fbcc84cca21
    portainer-run/git-branch: main
    portainer-run/git-path: local/portainer-run-applications/concept-test.yaml
    portainer-run/runtime: nginx
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  rules:
    - host: concept-test.heyronmar.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: concept-test
                port:
                  number: 8080
