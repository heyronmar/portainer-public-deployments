apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: expense-tracker-data
  namespace: default
  labels:
    app: expense-tracker
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: 85229a2d-179d-4558-a483-fa670a5a21ec
    portainer-run/git-branch: main
    portainer-run/git-path: local/default/expense-tracker.yaml
    portainer-run/vibe-source-path: local/default/expense-tracker/src
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-tracker
  namespace: default
  labels:
    app: expense-tracker
    managed-by: portainer-run
  annotations:
    portainer-run/deploy-type: vibe
    portainer-run/git-target-id: 85229a2d-179d-4558-a483-fa670a5a21ec
    portainer-run/git-branch: main
    portainer-run/git-path: local/default/expense-tracker.yaml
    portainer-run/vibe-source-path: local/default/expense-tracker/src
spec:
  replicas: 1
  selector:
    matchLabels:
      app: expense-tracker
  template:
    metadata:
      labels:
        app: expense-tracker
        managed-by: portainer-run
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      initContainers:
        - name: vibe-sync
          image: alpine/git:latest
          command:
            - sh
            - '-c'
            - >-
              git config --global http.sslVerify false && git clone --depth 1 --branch main
              https://${GIT_USERNAME}:${GIT_TOKEN}@github.com/heyronmar/portainer-public-deployments /tmp/repo && mkdir
              -p /app && cp -r /tmp/repo/local/default/expense-tracker/src/. /app/ && rm -rf /tmp/repo
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: app-data
              mountPath: /app
          env:
            - name: GIT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: expense-tracker-git-credentials
                  key: username
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: expense-tracker-git-credentials
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        - name: vibe-install
          image: node:22
          command:
            - sh
            - '-c'
            - >-
              cd /app && if [ -f package.json ]; then if [ -f /usr/local/include/node/common.gypi ]; then export
              npm_config_nodedir=/usr/local; fi; npm install --omit=dev 2>&1; fi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 2Gi
          volumeMounts:
            - name: app-data
              mountPath: /app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
            seccompProfile:
              type: RuntimeDefault
        - name: vibe-env
          image: busybox:1.36
          command:
            - sh
            - '-c'
            - |-
              printf '%s' 'PORT=3000
              APP_TITLE=Expense Tracker
              CURRENCY=USD' > /app/.env
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: app-data
              mountPath: /app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: expense-tracker
          image: node:22
          command:
            - sh
            - '-c'
            - npm start
          workingDir: /app
          ports:
            - containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: app-data
              mountPath: /app
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: '1'
              memory: 4Gi
          env:
            - name: PORT
              value: '3000'
            - name: APP_TITLE
              value: Expense Tracker
            - name: CURRENCY
              value: USD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: expense-tracker-data
---
apiVersion: v1
kind: Service
metadata:
  name: expense-tracker
  namespace: default
  labels:
    app: expense-tracker
    managed-by: portainer-run
spec:
  type: ClusterIP
  selector:
    app: expense-tracker
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: expense-tracker
  namespace: default
  labels:
    app: expense-tracker
    managed-by: portainer-run
spec:
  rules:
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: expense-tracker
                port:
                  number: 3000
