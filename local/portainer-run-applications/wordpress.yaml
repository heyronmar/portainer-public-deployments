# ─────────────────────────────────────────────
# Secrets
# ─────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-mysql-secret
  namespace: portainer-run-applications
  labels:
    app: wordpress
type: Opaque
stringData:
  mysql-root-password: "ch4nge-me-root"
  mysql-database: "wordpress"
  mysql-user: "wordpress"
  mysql-password: "ch4nge-me-wp"
---
# ─────────────────────────────────────────────
# MySQL PVC
# ─────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-mysql-data
  namespace: portainer-run-applications
  labels:
    app: wordpress
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# ─────────────────────────────────────────────
# WordPress PVC
# ─────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-data
  namespace: portainer-run-applications
  labels:
    app: wordpress
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# ─────────────────────────────────────────────
# MySQL Deployment
# ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-mysql
  namespace: portainer-run-applications
  labels:
    app: wordpress
    component: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress
      component: mysql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: wordpress
        component: mysql
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      automountServiceAccountToken: false
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
              protocol: TCP
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordpress-mysql-secret
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: wordpress-mysql-secret
                  key: mysql-database
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: wordpress-mysql-secret
                  key: mysql-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordpress-mysql-secret
                  key: mysql-password
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: wordpress-mysql-data
---
# ─────────────────────────────────────────────
# MySQL Service (cluster-internal only)
# ─────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: wordpress-mysql
  namespace: portainer-run-applications
  labels:
    app: wordpress
    component: mysql
spec:
  type: ClusterIP
  selector:
    app: wordpress
    component: mysql
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
---
# ─────────────────────────────────────────────
# WordPress Deployment
# ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: portainer-run-applications
  labels:
    app: wordpress
    component: wordpress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress
      component: wordpress
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: wordpress
        component: wordpress
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 33
        fsGroup: 33
      automountServiceAccountToken: false
      containers:
        - name: wordpress
          image: wordpress:6.7-apache
          ports:
            - containerPort: 80
              protocol: TCP
          env:
            - name: WORDPRESS_DB_HOST
              value: wordpress-mysql:3306
            - name: WORDPRESS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: wordpress-mysql-secret
                  key: mysql-database
            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: wordpress-mysql-secret
                  key: mysql-user
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordpress-mysql-secret
                  key: mysql-password
          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: wordpress-data
          persistentVolumeClaim:
            claimName: wordpress-data
---
# ─────────────────────────────────────────────
# WordPress Service
# ─────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: portainer-run-applications
  labels:
    app: wordpress
    component: wordpress
spec:
  type: ClusterIP
  selector:
    app: wordpress
    component: wordpress
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
---
# ─────────────────────────────────────────────
# Ingress
# ─────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wordpress
  namespace: portainer-run-applications
  labels:
    app: wordpress
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - wordpress-test.ronmarlacamiento.com
      secretName: wordpress-tls
  rules:
    - host: wordpress-test.ronmarlacamiento.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress
                port:
                  number: 80
