apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: namespaces
  labels:
    app: sample-app
    managed-by: portainer-idp
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: target-space/namespaces/sample-app.yaml
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '28'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
        managed-by: portainer-idp
    spec:
      containers:
        - name: app
          image: nginx:latest
          imagePullPolicy: Always
