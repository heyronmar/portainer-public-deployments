apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: concept-test-data
  namespace: concept-test
  labels:
    app: concept-test
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: production-idp/concept-test/concept-test.yaml
    portainer-idp/deploy-type: manifest-builder
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '1'
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: concept-test
  namespace: concept-test
  labels:
    app: concept-test
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: production-idp/concept-test/concept-test.yaml
    portainer-idp/deploy-type: manifest-builder
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '1'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: concept-test
  template:
    metadata:
      labels:
        app: concept-test
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: concept-test
          image: ghcr.io/heyronmar/concept-testing-app:sha-51234507cc61b22cc2478beb51cf1e480cd00eaf
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOSTNAME
              value: 0.0.0.0
            - name: PORT
              value: '3000'
            - name: DATABASE_PATH
              value: /data/concept-test.db
            - name: DEMO_URL
              value: https://ui-preview.portainercloud.io/addons/portainer-ops/home
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: concept-test-data
---
apiVersion: v1
kind: Service
metadata:
  name: concept-test
  namespace: concept-test
  labels:
    app: concept-test
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: production-idp/concept-test/concept-test.yaml
    portainer-idp/deploy-type: manifest-builder
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '1'
spec:
  type: NodePort
  selector:
    app: concept-test
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: concept-test
  namespace: concept-test
  labels:
    app: concept-test
  annotations:
    portainer-idp/git-target-id: '1'
    portainer-idp/git-branch: main
    portainer-idp/git-path: production-idp/concept-test/concept-test.yaml
    portainer-idp/deploy-type: manifest-builder
    portainer-idp/edge-stack: 'true'
    portainer-idp/edge-group-ids: '1'
spec:
  ingressClassName: traefik
  rules:
    - host: form.ui-preview.portainercloud.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: concept-test
                port:
                  name: http
