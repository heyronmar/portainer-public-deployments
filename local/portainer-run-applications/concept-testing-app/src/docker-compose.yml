services:
  concept-test:
    build: .
    image: portainer-v3-concept-test:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATABASE_PATH: /data/concept-test.db
      DEMO_URL: ${DEMO_URL:-https://portainer-laptop.heyronmar.com}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-} # /admin stays disabled until this is set
    volumes:
      - concept-test-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  concept-test-data:
